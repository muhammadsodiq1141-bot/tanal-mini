<style>
/* Layout: study desk — fixed topic index on the left, working sheet on the right; collapses to one column on phones. */
:root{
  --paper:#f6f5f2; --sheet:#ffffff; --ink:#15171c; --muted:#5d6270; --line:#dcdad3;
  --navy:#16305e; --navy-soft:#e7ecf5; --crimson:#a8192e; --crimson-soft:#f8e8ea;
  --ok:#1f7a4a; --ok-soft:#e3f2e9; --warn:#9a6a00; --bar:#15171c; --bar-fg:#f3f1ea;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111318; --sheet:#181b22; --ink:#e9e8e4; --muted:#9aa0ad; --line:#2a2f3a;
  --navy:#8fb0ec; --navy-soft:#1c2740; --crimson:#ff7a8a; --crimson-soft:#3a1d23;
  --ok:#5fd394; --ok-soft:#163626; --warn:#e3b341; --bar:#07080b; --bar-fg:#f3f1ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111318; --sheet:#181b22; --ink:#e9e8e4; --muted:#9aa0ad; --line:#2a2f3a;
  --navy:#8fb0ec; --navy-soft:#1c2740; --crimson:#ff7a8a; --crimson-soft:#3a1d23;
  --ok:#5fd394; --ok-soft:#163626; --warn:#e3b341; --bar:#07080b; --bar-fg:#f3f1ea; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;font-size:1.22em;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-ar);font-size:24px;font-weight:700;color:#fff}
.brand span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#c9c6bc}
.brand i{font-style:normal;color:#ff8d9b}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:transparent;border:1px solid transparent;color:#d9d6cc;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--bar-fg);color:var(--bar)}
nav.tabs button:hover{border-color:#5a5f6c}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 60px)}
aside.idx{border-right:1px solid var(--line);background:var(--sheet);padding:14px 0;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
.idx h3{margin:16px 16px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.idx h3 .ar{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 14px 6px 13px;cursor:pointer}
.tp:hover{background:var(--navy-soft)}
.tp[aria-current="true"]{border-left-color:var(--crimson);background:var(--navy-soft)}
.tp .ar{font-size:17px;line-height:1.35;text-align:left;direction:rtl;justify-self:start}
.tp small{grid-column:1;color:var(--muted);font-size:12px;line-height:1.3}
.tp .cnt{grid-row:1/span 2;grid-column:2;align-self:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.tp .cnt em{display:block;font-style:normal;color:var(--ok)}
.tag-new{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--crimson);text-transform:uppercase}

main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1.tt{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1.tt .ar{font-size:36px;font-weight:700;line-height:1.3}
h1.tt small{font-size:17px;font-weight:500;color:var(--muted)}
.blk{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.blk h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.blk.book h4{color:var(--muted)}
.blk.fix{border-color:color-mix(in srgb,var(--crimson) 45%,var(--line));background:var(--crimson-soft)}
.blk.fix h4{color:var(--crimson)}
.blk.add h4{color:var(--navy)}
.blk ul{margin:0;padding-left:20px}
.blk li{margin:4px 0}
.rule{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rule:first-of-type{border-top:0;margin-top:0;padding-top:0}
.rule h5{margin:0 0 4px;font-size:15px;color:var(--navy)}
.rule .body{max-width:72ch}
ul.ex{list-style:none;padding:0;margin:8px 0 2px;display:flex;flex-direction:column;gap:2px;border-right:3px solid var(--navy);padding-right:12px}
ul.ex li{font-size:15px;line-height:1.7;text-align:start}
ul.ex li.ar{font-size:20px;line-height:1.6}
ul.ex li .ar{font-size:1.3em}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:5px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--crimson);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:13px}

/* practice setup */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
select,input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--sheet);color:var(--ink);min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--sheet)}

/* question card */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.qhead b{color:var(--ink);font-family:var(--f-ui)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--crimson);transition:width .25s}
.qbody{padding:18px 20px 8px;display:flex;flex-direction:column;gap:12px}
.stem{font-size:24px;line-height:1.75;text-align:right}
.sent{font-size:26px;text-align:right;background:var(--navy-soft);padding:10px 14px;border-radius:6px;line-height:2.1}
.sent u{text-decoration:none;border-bottom:2px solid var(--navy);padding:0 2px;position:relative}
.sent u sup{font-family:var(--f-ar);font-size:13px;color:var(--crimson);font-weight:700;position:relative;top:-.9em;margin-inline-start:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 20px 18px;direction:rtl}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:10px 14px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:1px solid var(--line);font-family:var(--f-ar);font-size:18px;font-weight:700}
.opt .ar{font-size:23px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.opt.bad{border-color:var(--crimson);background:var(--crimson-soft)}
.opt.bad .k{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.opt:disabled{cursor:default}
.fb{margin:0 20px 18px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.miss{border-color:var(--crimson);background:var(--crimson-soft)}
.fb.self{border-color:var(--warn)}
.fb strong{font-size:14px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 20px 18px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* results */
.score{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.score b{font-size:44px;font-family:var(--f-mono);font-weight:500}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th,.st td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.st th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.st td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--navy)}
.tblwrap{overflow-x:auto}
.wl{display:flex;flex-direction:column;gap:8px}
.wi{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.wi .ar{font-size:19px;text-align:right}
.wi small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:var(--sheet)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside.idx{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  aside.idx.collapsed .bk{display:none}
  .opts{grid-template-columns:1fr}
  h1.tt .ar{font-size:30px}
  .stem{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.idxtoggle{display:none}
@media (max-width:820px){.idxtoggle{display:flex;margin:0 16px 4px}}
</style>
<style>
/* additions: study planner */
.shell.full{grid-template-columns:1fr}
.shell.full aside.idx{display:none}
.brand b{white-space:nowrap}
@media (max-width:520px){.brand>span:not(.sync){display:none}}
.sync{font-size:11px;font-family:var(--f-mono);color:#c9c6bc;white-space:nowrap}
.sync.on{color:#7fe0a8}
@media (max-width:820px){nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;margin-left:0;scrollbar-width:none}nav.tabs button{flex:none}}
.daybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.daybar .nav{display:flex;gap:6px;align-items:center}
.daybar .nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:16px}
.daybig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.daybig b{font-family:var(--f-mono);font-size:40px;font-weight:500;line-height:1}
.daybig span{color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--crimson);color:#fff}
.badge.navy{background:var(--navy);color:var(--sheet)}
.focus{border-left:3px solid var(--crimson);padding:4px 0 4px 12px;color:var(--ink);max-width:70ch}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{background:var(--sheet);border:1px solid var(--line);border-radius:7px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 16px}
.task.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.task>*:not(.ck){grid-column:2;min-width:0}
.task .ck{grid-column:1;grid-row:1/span 4;width:26px;height:26px;border-radius:5px;border:2px solid var(--line);background:var(--sheet);cursor:pointer;display:grid;place-items:center;color:var(--sheet);font-weight:700;margin-top:2px}
.task.done .ck{background:var(--ok);border-color:var(--ok)}
.task .tm{font-family:var(--f-mono);font-size:12px;color:var(--crimson);font-weight:500}
.task h3{margin:0;font-size:16px}
.task .what{color:var(--muted);font-size:14px}
.task .what .ar{color:var(--ink)}
.task .cta{margin-top:6px}
.btn.sm{padding:6px 12px;font-size:13px}
textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);padding:12px 14px;resize:vertical}
textarea.arw{font-family:var(--f-ar);font-size:21px;line-height:1.9;direction:rtl;min-height:260px}
textarea.diary{font-family:var(--f-ar);font-size:19px;direction:rtl;min-height:120px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cell{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:104px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;min-width:0}
.cell:hover{border-color:var(--navy)}
.cell.today{outline:2px solid var(--crimson);outline-offset:-1px}
.cell.mock{background:var(--crimson-soft)}
.cell .dn{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cell .dn b{color:var(--ink);font-size:15px}
.cell small{font-size:11.5px;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.cell .pb{margin-top:auto;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.cell .pb i{display:block;height:100%;background:var(--ok)}
.cell.pad{visibility:hidden}
@media (max-width:820px){.cal{grid-template-columns:1fr 1fr}.cal .hd,.cell.pad{display:none}.cell{min-height:0}}
.prompt{font-size:22px;line-height:1.9;text-align:right}
.wc{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wc b.over{color:var(--ok)}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:500}
.timer.low{color:var(--crimson)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.scores div{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.scores b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.scores span{font-size:12px;color:var(--muted)}
.errs{display:flex;flex-direction:column;gap:8px}
.err{border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--sheet)}
.err .pair{font-family:var(--f-ar);direction:rtl;font-size:20px;text-align:right}
.err .pair s{color:var(--crimson);text-decoration-thickness:2px}
.err .pair ins{color:var(--ok);text-decoration:none;font-weight:700}
.err .k{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);align-self:start}
.err p{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted)}
.marked{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:20px;line-height:2;white-space:pre-wrap}
.marked mark{background:var(--crimson-soft);color:var(--crimson);border-bottom:2px solid var(--crimson);padding:0 1px}
.passage{font-family:var(--f-ar);direction:rtl;text-align:justify;font-size:21px;line-height:2}
.passage p{margin:0 0 .8em}
.rimg{display:block;width:100%;max-width:820px;height:auto;margin:8px auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.rans{display:flex;align-items:center;gap:6px;direction:rtl}.rans b{min-width:26px;text-align:center}.rans .opt{padding:6px 12px;min-width:44px;justify-content:center}
.rk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:14px}.rk.ok{border-color:var(--ok);background:rgba(31,122,44,.08)}.rk.bad{border-color:var(--crimson);background:rgba(200,40,40,.06)}
.matl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:10px 0 0}.matl dt{font-weight:700}.matl dd{margin:0}.mat .ar{font-size:1.15em}
@media (max-width:560px){.matl{grid-template-columns:1fr}.matl dd{margin-bottom:6px}}
.rq{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rq .stem{font-size:20px}
.rq .opts{padding:8px 0 4px}
.rq .opt .ar{font-size:19px}
.why{font-size:14px;color:var(--ink);white-space:pre-wrap}
.flash{background:var(--sheet);border:1px solid var(--line);border-radius:10px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;cursor:pointer}
.flash .w{font-family:var(--f-ar);font-size:38px;line-height:1.5;direction:rtl}
.flash .m{font-size:19px;color:var(--navy);font-weight:500}
.flash .hint{font-size:12px;color:var(--muted)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.vlist div{background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:6px 10px;display:flex;flex-direction:column}
.vlist .ar{font-size:19px;text-align:right}
.vlist small{color:var(--muted)}
.boxes{display:flex;gap:4px;align-items:flex-end;height:60px}
.boxes div{flex:1;background:var(--navy);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.boxes-l{display:flex;gap:4px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.boxes-l span{flex:1;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--crimson);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
</style>
<style>
/* additions: muhodasa (og‘zaki nutq) + Claude’dan so‘rash */
main{padding-bottom:110px}
.ico{width:17px;height:17px;flex:none;vertical-align:-3px}

<script>
window.__boot = function(C){
const D = C.data;
const PL = C.plan;
const T = {}; D.topics.forEach(t => T[t.id] = t);
const BOOK = {}; D.books.forEach(b => BOOK[b.id] = b);
D.q.forEach((q, i) => q.i = i);
const LET = ['أ','ب','جـ','د'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const DAYS = PL.days, NV = PL.vocab.length, ND = DAYS.length;
const LST = C.listen || {sets:[]};
const OFF = C.official || {gram:[], read:[]};
const MED = C.media || {read:[], speak:{}};
const MURL = p => AURL(p);                    // rasm va audio manzili (mini ilovada imzoli havola)

/* ---------- storage: browser cache + private cloud docs ---------- */
const LSK = k => 'tmini-' + k;
function lsGet(k){ try { return JSON.parse(localStorage.getItem(LSK(k)) || 'null'); } catch(e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(LSK(k), JSON.stringify(v)); } catch(e) {} }
let DB = null, BASE = null, KVC = {};
const pend = {}, busy = {}, tmr = {};
function setSync(t, on){ const s = $('#sync'); s.textContent = t; s.classList.toggle('on', !!on); }
function put(k, v){
  v.ts = Date.now(); lsSet(k, v);
  if (!DB) return;
  pend[k] = v; clearTimeout(tmr[k]); tmr[k] = setTimeout(() => flush(k), 1200);
}
async function flush(k){
  if (busy[k] || !pend[k]) return;
  const v = pend[k]; delete pend[k]; busy[k] = true;
  try { await DB.doc(BASE + '/' + k).set(JSON.parse(JSON.stringify(v))); setSync('bulutda saqlandi', true); }
  catch(e) { setSync('saqlanmadi — brauzerda', false); }
  busy[k] = false; if (pend[k]) flush(k);
}
async function pull(k){
  if (!DB) return null;
  try { const s = await DB.doc(BASE + '/' + k).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; }
  catch(e) { return null; }
}
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);

let P = lsGet('prog') || {a:{}, w:{}, ts:0};
try { const old = JSON.parse(localStorage.getItem('tanal-grammar-v1') || 'null'); if (old && !P.ts) { P.a = old.a || {}; P.w = old.w || {}; } } catch(e) {}
let PS = lsGet('plan') || {done:{}, diary:{}, ts:0};
let VS = lsGet('voc') || {c:{}, ts:0};
const DAYDOC = {}; // e01.., r01..
function dayDoc(k){ if (!(k in DAYDOC)) DAYDOC[k] = lsGet(k); return DAYDOC[k]; }
function setDayDoc(k, v){ DAYDOC[k] = v; put(k, v); }
async function syncDay(d){
  if (!DB) return;
  for (const k of ['e' + pad2(d) + 'w100', 'e' + pad2(d) + 'w150', 'e' + pad2(d) + 'w200', 'r' + pad2(d), 'm' + pad2(d), 'k' + pad2(d), 'l' + pad2(d)]) {
    const r = await pull(k), l = dayDoc(k);
    if (r && (!l || (r.ts||0) > (l.ts||0))) { DAYDOC[k] = r; lsSet(k, r); if (view === 'write' || view === 'read' || view === 'mock' || (view === 'listen' && !LSN) || (view === 'speak' && SPK.mode === 'menu')) render(); }
    else if (l && (!r || (l.ts||0) > (r.ts||0))) put(k, l);
  }
}
function save(){ put('prog', P); }
function savePlan(){ put('plan', PS); }
function saveVoc(){ put('voc', VS); }

function initCloud(){
  const K = window.__KV;
  if (!K) { setSync('oflayn — telefonda saqlanadi', false); return; }
  KVC = K;
  DB = {doc: p => { const k = p.split('/').pop(); return {
    set: v => window.__API('set', {key:k, val:v}).then(() => { KVC[k] = v; }),
    get: async () => (k in KVC ? {exists:true, data:() => KVC[k]} : {exists:false, data:() => null})
  }; }};
  BASE = 'u';
  const merge = (k, local, apply) => {
    const r = KVC[k] ? JSON.parse(JSON.stringify(KVC[k])) : null;
    if (r && (r.ts || 0) > (local.ts || 0)) { apply(r); lsSet(k, r); return true; }
    if (local.ts && (!r || (local.ts || 0) > (r.ts || 0))) put(k, local);
    return false;
  };
  const ch = [
    merge('prog', P, r => { P = Object.assign({a:{}, w:{}}, r); }),
    merge('plan', PS, r => { PS = Object.assign({done:{}, diary:{}}, r); }),
    merge('voc', VS, r => { VS = Object.assign({c:{}, u:[]}, r); })];
  setSync('bulutda saqlanadi', true);
  syncDay(selDay);
  if (ch.some(Boolean)) render();
}
/* ---------- Claude (sample) ---------- */
let SAMPLE;
async function getSample(){
  if (SAMPLE !== undefined) return SAMPLE;
  if (!window.claude || !window.claude.use) return SAMPLE = null;
  SAMPLE = await withTimeout(claude.use('sample'), 10000);
  return SAMPLE;
}
function sampleErr(e){
  const c = e && e.code;
  if (c === 'not_granted') return 'Claude’ga ruxsat berilmadi. Bu funksiyani ishlatish uchun sahifa ruxsatlarini oching.';
  if (c === 'rate_limited') return 'Hozir so‘rovlar chegarasiga yetildi. Birozdan keyin qayta urinib ko‘ring.';
  if (c === 'invalid_json') return 'Javob to‘liq kelmadi. Yana bir marta bosing.';
  if (c === 'session_expired') return 'claude.ai’dan chiqib ketilgan. Qayta kiring va sahifani yangilang.';
  if (c === 'refused') return 'Claude bu so‘rovni bajarmadi. So‘rovni boshqacha ifodalab ko‘ring.';
  if (c === 'sampling_disabled' || c === 'capability_disabled') return 'Bu hisobda Claude funksiyalari o‘chirilgan.';
  if (c === 'cancelled') return 'To‘xtatildi.';
  return 'Claude javob bermadi — internet yoki xizmatda uzilish. Birozdan keyin qayta bosing.';
}
/* E6: kutilayotgan Claude so‘rovlari — o‘tgan vaqt, ikki marta yuborishdan himoya */
const PEND = {};
const pendStart = k => { PEND[k] = Date.now(); };
const pendEnd = k => { delete PEND[k]; };
const isPend = k => k in PEND;
function waitHtml(k, label, typical){
  return `<span class="wait" data-wait="${k}"><span class="spin"></span> ${label} · <b class="el">${isPend(k) ? Math.round((Date.now() - PEND[k]) / 1000) : 0} s</b> · odatda ${typical}. Boshqa bo‘limga o‘tsangiz ham natija saqlanadi.</span>`;
}
setInterval(() => document.querySelectorAll('[data-wait]').forEach(el => { const t = PEND[el.dataset.wait]; const b = el.querySelector('.el'); if (t && b) b.textContent = Math.round((Date.now() - t) / 1000) + ' s'; }), 1000);

/* ---------- dates ---------- */
const START = new Date(DAYS[0].date + 'T00:00:00');
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / 864e5);
function todayIdx(){ const n = Math.floor((new Date().setHours(0,0,0,0) - START) / 864e5) + 1; return Math.min(ND, Math.max(1, n)); }
/* imtihon sanasi: 20-dekabr (yakshanba) yoki 19-dekabr (shanba) — PS.ex19 bilan almashtiriladi */
const EX19 = {36:{ph:'light', lv:'90', note:'Yengil kun (imtihon 19-dekabrda): ≤ 90 daqiqa, faqat takror'},
  37:{ph:'light', lv:'45', note:'≤ 45–60 daqiqa isinish va logistika; 19-dekabr uchun ishdan javob olinadi', wl:[]},
  38:{ph:'exam', note:'IMTIHON — 19-dekabr, shanba', wl:[], sp:null}, 39:{ph:'rest', note:'Dam olish — imtihon 19-dekabrda o‘tdi', wl:[], sp:null}};
const examDay = () => PS.ex19 ? ND - 1 : ND;
let selDay = todayIdx();
const DY = d => { const y = DAYS[d-1]; if (!y || !PS.ex19 || !EX19[y.d]) return y;
  const o = Object.assign({}, y, EX19[y.d]); if (y.d === 36) { o.wl = DAYS[36].wl; o.sp = DAYS[36].sp; } return o; };
const LV = y => y.lv || ({36:'n', 37:'90', 38:'45'})[y.d] || 'n';
const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return `${d}-${['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'][m-1]}`; };

/* ---------- progress ---------- */
/* B3: Xatolarim — to‘g‘ri javob faqat oraliq bilan hisoblanadi: +1, +3, +8 kun (Cepeda 2008: 35 kunlik ufq uchun 8–11 kun) */
const H6 = 20 * 3600e3, WSTEP = [1, 3, 8].map(k => k * 864e5);
const DAY3 = WSTEP[1];
function wget(i){ const w = P.w[i]; if (w == null) return null; return typeof w === 'number' ? {n:w, due:0} : w; }
const wDue = i => { const w = wget(i); return !!w && (w.due || 0) <= Date.now(); };
function record(q, right){
  const first = !P.a[q.i];
  const r = P.a[q.i] || [0,0]; r[0]++; if (right) r[1]++; P.a[q.i] = r;
  if (first) { P.f = P.f || {}; P.f[q.i] = right ? 1 : 0; }      // D8: birinchi urinish natijasi
  const now = Date.now(), w = wget(q.i);
  let counted = true;
  if (right) {
    if (w) {

}

function topicsOfDay(d){ const y = DY(d); return y ? [...y.nahv, ...y.sarf, ...y.imla].filter(id => T[id] && T[id].n) : []; }
function pickFrom(ids, n, used){
  if (n <= 0) return [];
  const qs = shuffle(D.q.filter(q => ids.includes(q.t) && !used.has(q.i)));
  qs.sort((a, b) => (P.a[a.i] ? 1 : 0) - (P.a[b.i] ? 1 : 0) || (wDue(b.i) ? 1 : 0) - (wDue(a.i) ? 1 : 0));
  const out = qs.slice(0, n); out.forEach(q => used.add(q.i)); return out;
}
function weakTopics(n){
  const rows = D.topics.filter(t => t.n).map(t => { const s = topicStats(t.id); return {id:t.id, w:(s.done ? 1 - s.ok / s.done : 0.5) + (s.done < Math.min(8, t.n) ? 0.2 : 0)}; });
  rows.sort((a, b) => b.w - a.w); return rows.slice(0, n).map(r => r.id);
}
function spacedTopics(d){ const s = new Set(); [1, 3, 8, 18].forEach(k => { if (d - k >= 1) topicsOfDay(d - k).forEach(t => s.add(t)); }); return [...s]; }
function mixList(d, todayIds, nToday, nPrev){
  const used = new Set(), a = pickFrom(todayIds, nToday, used);
  let prev = spacedTopics(d).filter(t => !todayIds.includes(t));
  if (!prev.length) prev = weakTopics(6).filter(t => !todayIds.includes(t));
  const b = pickFrom(prev, nPrev, used);
  return shuffle(a.concat(b)).map(q => q.i);
}
/* A3/B2: sinov va yig‘ma test — har mavzuga zaifligiga qarab kvota */
function quotaList(ids, N){
  const ws = ids.map(id => { const s = topicStats(id); return {id, w:(s.done ? 1 - s.ok / s.done : 0.5) + (s.done < 5 ? 0.2 : 0)}; });
  const sw = ws.reduce((a, x) => a + x.w, 0) || 1, used = new Set();
  const base = N >= ids.length ? 1 : 0;
  let out = [];
  ws.forEach(x => { out = out.concat(pickFrom([x.id], base + Math.round((N - base * ids.length) * x.w / sw), used)); });
  shuffle(out);
  if (out.length < N) out = out.concat(pickFrom(ids, N - out.length, used));
  return out.slice(0, N).map(q => q.i);
}

  return i < NV ? PL.vocab[i] : (i < UOFF ? VADD[i - NV] && [VADD[i - NV].ar, VADD[i - NV].uz, VADD[i - NV].ex] : VS.u[i - UOFF]); }

function addIntroLim(d){ if (!VADD.length) return 0; const from = 5, to = 24; d = Math.min(d, NEWSTOP); if (d < from) return 0; return Math.min(VADD.length, Math.ceil(VADD.length / (to - from + 1)) * (Math.min(d, to) - from + 1)); }

function buildQueue(){

  const consider = i => { const c = VS.c[i]; if (!c || c[1] <= today) q.push(i); };
  for (let i = 0; i < lim; i++) if (!VX.has(i)) consider(i);

function typSource(){ const E = PL.essays || []; const i = ((PS.typ || []).length) % Math.max(1, E.length); return String((E[i] || {}).x || '').replace(/\n+/g, ' ').split(/\s+/).slice(0, 140).join(' '); }
function renderTyping(){
  clearInterval(tyTimer);

  const adv = r => !r ? '' : (r.wpm >= 25 && r.acc >= 95 ? 'Tezlik yetarli: 1–14-kunlarda kuniga 10 daqiqa tezlik mashqi.' : (r.wpm >= 15 ? 'O‘rtacha: kuniga 15 daqiqa — eng ko‘p ishlatiladigan harf va iboralar.' : 'Sekin: ikki hafta davomida kuniga 20 daqiqa Noqta darslari. Vaqtli inshoda yangi usul tezlashmaguncha eski usulda yozing.'));
  if (!TYP) TYP = {src:typSource(), t0:0, done:false, text:''};
  const S = TYP;
  $('#view').innerHTML = `<div class="daybar"><div><div class="eyebrow">Arabcha terish · 3 daqiqalik test</div><h1 class="tt"><span>${S.done ? `Natija: ${S.res.wpm} so‘z/daq · ${S.res.acc}%` : 'Matnni ko‘chirib yozing'}</span></h1></div><span class="timer" id="tyT">${S.done ? '' : '3:00'}</span></div>
    <section class="blk"><div class="passage" dir="rtl" lang="ar" style="font-size:20px">${esc(S.src)}</div></section>
    <textarea class="arw" id="tyA" dir="rtl" lang="ar" placeholder="Shu yerga yozing — taymer birinchi harfda boshlanadi" aria-label="Terish maydoni" ${S.done ? 'readonly' : ''}>${esc(S.text)}</textarea>
    ${S.done ? `<section class="blk"><p style="margin:0">${adv(S.res)}</p><p class="note">Imtihonda 450 so‘zni 60 daqiqada yozasiz — fikrlash vaqti bilan daqiqasiga ~15 so‘zlik ijodiy tezlik kerak.</p></section>` : ''}
    <div class="cta">${S.done ? '<button class="btn red" id="tyNew">Yangi test</button>' : ''}<a class="btn alt" href="https://noqta.tn/en/arabic-typing-tutor" target="_blank" rel="noopener">Noqta — arabcha terish darslari</a></div>
    ${hist.length ? `<p class="note">Oldingi natijalar: ${hist.slice(-8).map(r => `${r.wpm} so‘z/daq (${r.acc}%)`).join(' · ')}</p>` : ''}
    ${last && !S.done ? `<p class="note">${adv(last)}</p>` : ''}`;
  const ta = $('#tyA');
  const finish = () => { clearInterval(tyTimer); if (S.done) return;
    const A = norm(ta.value).split(' ').filter(Boolean), B = norm(S.src).split(' ');
    const ok = A.filter((w, i) => w === B[i]).length, mins = Math.max(0.5, Math.min(3, (Date.now() - S.t0) / 60000));
    S.res = {wpm:Math.round(ok / mins), acc:A.length ? Math.round(ok / A.length * 100) : 0, n:A.length, at:Date.now()}; S.done = true; S.text = ta.value;
    PS.typ = (PS.typ || []).concat([S.res]).slice(-30); savePlan(); markTask(selDay, 'tK', true); renderTyping(); };
  const tick = () => { const el = $('#tyT'); if (!el || view !== 'typing') return clearInterval(tyTimer); const left = Math.round((S.t0 + 180000 - Date.now()) / 1000);
    if (left <= 0) return finish(); el.textContent = `${Math.floor(left / 60)}:${pad2(left % 60)}`; el.classList.toggle('low', left < 30); };
  if (!S.done) {
    ta.oninput = () => { S.text = ta.value; if (!S.t0) { S.t0 = Date.now(); tyTimer = setInterval(tick, 500); } };
    if (S.t0) tyTimer = setInterval(tick, 500);
    ta.onpaste = e => e.preventDefault();
  }
  const nw = $('#tyNew'); if (nw) nw.onclick = () => { TYP = null; renderTyping(); };
  paintAr();
}

const ICO = {
  mic: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
  vol: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'
};
const PREF = Object.assign({voice:true}, lsGet('pref') || {});
let DICT, TTS;
const MIC = {ta:null, pe:null, state:'idle', off:false};
const micOK = () => !!DICT && !MIC.off;
const MIC_LBL = {idle:'Gapirish', starting:'Ulanmoqda…', listening:'Tinglayapman — to‘xtatish', finishing:'Yozib olinmoqda…'};
async function initVoice(){
  if (!window.claude || !window.claude.use) { DICT = TTS = null; paintMic(); return; }
  const r = await withTimeout(Promise.all([claude.use('dictation').catch(() => null), claude.use('tts').catch(() => null)]), 10000) || [];
  DICT = r[0] || null; TTS = r[1] || null;
  if (DICT) {
    DICT.onFinal(({text}) => { const ta = MIC.ta; if (!ta || !ta.isConnected || !text) return; ta.value += ta.value.trim() ? text : text.replace(/^\s+/, ''); ta.dispatchEvent(new Event('input')); });
    DICT.onPartial(({text}) => { if (MIC.pe && MIC.pe.isConnected) MIC.pe.textContent = text; });
    DICT.onState(({state, reason}) => {
      MIC.state = state;
      if (state === 'idle') { if (MIC.pe && MIC.pe.isConnected) MIC.pe.textContent = ''; if (reason === 'unavailable' || reason === 'not_granted') MIC.off = true; }
      paintMic();
    });
  }
  paintMic();
}
function paintMic(){
  document.querySelectorAll('.mic').forEach(b => { b.hidden = !micOK(); b.classList.toggle('on', MIC.state !== 'idle'); b.setAttribute('aria-pressed', MIC.state !== 'idle'); b.innerHTML = ICO.mic + MIC_LBL[MIC.state]; });
  document.querySelectorAll('.micnote').forEach(n => { n.textContent = micOK() ? 'Arabcha gapiring — so‘zlar shu yerga yoziladi.' : 'Ovoz bilan javob: telefon klaviaturasidagi mikrofonni bosing (klaviatura tili — arabcha).'; });
  document.querySelectorAll('.spk').forEach(b => { b.hidden = !TTS; });
}
// start() must run synchronously inside the click handler
function micClick(ta, pe){
  if (!micOK()) return;
  if (MIC.state !== 'idle') { DICT.stop().catch(() => {}); return; }
  MIC.ta = ta; MIC.pe = pe;
  DICT.start({language:'ar'}).catch(e => { if (e && (e.code === 'unavailable' || e.code === 'not_granted')) MIC.off = true; paintMic(); });
}
function micBind(ta, pe){ MIC.ta = ta; MIC.pe = pe; }
async function micStop(){ if (DICT && MIC.state !== 'idle') { try { await DICT.stop(); } catch(e) {} } }
function sayAr(text){ if (!TTS || !text || MIC.state !== 'idle') return; TTS.speak(String(text).slice(0, 1990), {language:'ar', rate:0.9}).catch(() => {}); }
function sayStop(){ if (TTS && TTS.active()) TTS.stop().catch(() => {}); }

  const R = SPK, q = R.sess.q[R.i], it = ((R.sess.fb || {}).items || [])[R.i] || {}, base = SP_LV[q.lv].t, times = [base * 2, Math.round(base * 1.5), base];
  const head = `<div class="daybar"><div><div class="eyebrow">Muhodasa · qayta javob · ${R.i + 1}-savol</div><div class="spq" style="font-size:22px;text-align:left">${esc(q.s)}</div></div><div class="bigtimer ${R.phase === 'run' && R.left <= 10 ? 'low' : ''}" id="rdT">${R.phase === 'run' ? R.left : ''}</div></div>`;
  let body = '';
  if (R.phase === 'model') body = `<section class="blk add"><h4>Avval namunani o‘qing yoki eshiting</h4><div class="passage" style="font-size:20px">${esc(it.model || it.better || '—')}</div>

      <div class="cta"><button class="btn red" id="rdStart">Namunani yopib, 1-urinish (${times[0]} s)</button></div>`;

      <textarea class="ans" id="rdA" dir="rtl" lang="ar" style="margin-top:8px" aria-label="Javob">${esc((R.att[R.step] || {}).text || '')}</textarea><div class="partial" id="rdP"></div>
      <div class="wc"><span>So‘zlar: <b id="rdN">${words((R.att[R.step] || {}).text || '')}</b></span><span class="micnote"></span></div></section>
      <div class="cta">${R.phase === 'run' ? '<button class="btn red" id="rdEnd">Tugatdim</button><button class="btn alt mic" id="rdMic" hidden></button>' : (R.step < 2 ? `<button class="btn red" id="rdNext">${R.step + 2}-urinish (${times[R.step + 1]} s)</button>` : '<button class="btn red" id="rdFin">Natija</button>')}</div>`;
  else body = `<section class="blk"><h4>Natija</h4><div class="prof">${R.att.map((a, k) => `<div><b>${a.n}</b><span>${k + 1}-urinish · ${times[k]} s · ${Math.round(a.n / times[k] * 60)} so‘z/daq</span></div>`).join('')}</div>
      <p id="rdFb" style="margin:10px 0 0">${R.fb ? esc(R.fb) : ''}</p></section>
      <div class="cta">${!R.fb ? `<button class="btn alt" id="rdAsk" ${isPend('rd') ? 'disabled' : ''}>Claude 1- va 3-urinishni solishtirsin</button>` : ''}<button class="btn red" id="rdBack">Natijaga qaytish</button></div>`;
  $('#view').innerHTML = head + body;
  paintMic();
  const ta = $('#rdA'); if (ta) { ta.oninput = () => { R.att[R.step] = {text:ta.value, n:words(ta.value)}; $('#rdN').textContent = words(ta.value); }; if (R.phase === 'run') micBind(ta, $('#rdP')); }
  const sy = $('#rdSay'); if (sy) sy.onclick = () => { if (TTS) TTS.speak(String(it.model || '').slice(0, 1990), {language:'ar', rate:0.9}).catch(() => {}); };
  const startAtt = () => { sayStop(); if (micOK()) micClick(null, null); R.phase = 'run'; R.left = times[R.step]; R.att[R.step] = R.att[R.step] || {text:'', n:0}; renderRedo(); if (micOK()) micBind($('#rdA'), $('#rdP')); };
  const st = $('#rdStart'); if (st) st.onclick = startAtt;
  const endAtt = async () => { clearInterval(sTimer); await micStop(); const t = $('#rdA'); if (t) R.att[R.step] = {text:t.value, n:words(t.value)}; R.phase = 'gap'; if (SPK === R) renderRedo(); };
  const en = $('#rdEnd'); if (en) en.onclick = endAtt;
  const mb = $('#rdMic'); if (mb) mb.onclick = () => micClick($('#rdA'), $('#rdP'));
  const nx = $('#rdNext'); if (nx) nx.onclick = () => { R.step++; startAtt(); };
  const fn = $('#rdFin'); if (fn) fn.onclick = () => { R.phase = 'res'; const re = Object.assign({}, R.sess.re || {}); re[R.i] = {att:R.att.map(a => ({n:a.n})), fb:''}; R.sess.re = re; spSave(R.d, 'ex', R.sess); renderRedo(); };
  const ask = $('#rdAsk'); if (ask) ask.onclick = async () => {
    const s = await getSample(); if (!s) { $('#rdFb').textContent = 'Claude bu ko‘rinishda mavjud emas.'; return; }
    pendStart('rd'); ask.disabled = true; $('#rdFb').innerHTML = waitHtml('rd', 'Solishtirilmoqda', '10–20 s');
    try {
      const r = await s(`Talaba bitta Tanal muhodasa savoliga uch marta javob berdi (4/3/2 ravonlik mashqi). O‘zbek tilida (lotin), Markdown’siz, 3–4 jumlada ayt: 1-urinishga nisbatan 3-urinishda nima yaxshilandi (hajm, bog‘lovchilar, tuzilmalar), qaysi xato qoldi. Harakat va i’rob oxirini baholama.
Savol: ${q.s}
1-urinish: ${(R.att[0] || {}).text || '—'}
3-urinish: ${(R.att[2] || {}).text || '—'}`, {modelTier:'quick', cache:false});
      R.fb = r.text.trim(); const re = Object.assign({}, R.sess.re || {}); re[R.i] = {att:R.att.map(a => ({n:a.n})), fb:R.fb}; R.sess.re = re; spSave(R.d, 'ex', R.sess);

const CH_RULES = topic => `Sen talabaning arab tilidagi suhbatdoshi va ustozisan. Talaba Tanal imtihonining og‘zaki qismiga tayyorlanmoqda: darajasi B2, maqsadi C1. Suhbat mavzusi: «${topic}».
Fusho arab tilida tabiiy va do‘stona gapir. Har javobing 1–3 qisqa jumla bo‘lsin va oxirida bitta savol bilan suhbatni davom ettir; savollaring asta-sekin murakkablashsin (tasvirlash → sabab → fikr va taqqoslash). Muhim so‘zlarda harakat qo‘y.
Talaba gaplari nutqdan avtomatik yozilgan bo‘lishi mumkin: harakatlar, so‘z oxiridagi i’rob va tinish belgilari ko‘rinmasligi mumkin — ularni xato deb hisoblama. So‘z tanlash, so‘z tartibi, jins va son moslashuvi, fe’l shakli, predloglar va bog‘lovchilardagi xatolarni tuzat — har gapdan ko‘pi bilan 2 ta eng muhim xatoni.
Javobingda talabaning xato shaklini to‘g‘ri holda tabiiy qayta ishlat (uni tuzatib turganingni aytma). Talaba javobi 3 jumladan qisqa bo‘lsa, keyingi savoling uni sabab yoki misol bilan kengaytirishga undasin (Tanal’da javob 30–60 soniya davom etadi).`;
function spChatStart(d, topic){
  SPK = {mode:'chat', d, at:Date.now(), topic, turns:[], sum:null, ended:false, busy:false, draft:'', err:'', flu:PREF.chat !== 'acc'};
  speakDay = d;
  spChatCall(SPK);
}
async function spChatCall(S){
  S.busy = true; S.err = ''; S.errAt = '';
  if (SPK === S && view === 'speak') renderSpeak();
  const s = await getSample();
  if (!s) { S.busy = false; S.err = 'Claude bu ko‘rinishda mavjud emas — ilovani claude.ai’da oching.'; S.errAt = 'turn'; if (SPK === S && view === 'speak') renderSpeak(); return; }
  const last = S.turns.length && S.turns[S.turns.length - 1].r === 'u' ? S.turns[S.turns.length - 1] : null;
  const hist = S.turns.slice(-16).map(t => (t.r === 'u' ? 'Talaba: ' : 'Siz: ') + t.t).join('\n');
  const prompt = CH_RULES(S.topic) + '\n\n' + (last
    ? `Suhbat hozirgacha:\n${hist}\n\nTalabaning oxirgi gapini tekshir va suhbatni davom ettir. Faqat bitta JSON qaytar:\n{"fix":[{"x":"talaba gapidan AYNAN parcha","f":"to‘g‘ri shakli","uz":"o‘zbekcha qisqa izoh"}],"better":"talaba gapining tuzatilgan, tabiiyroq varianti (xato bo‘lmasa bo‘sh satr)","reply":"sening arabcha javobing va keyingi savoling"}`
    : `Suhbatni boshla: qisqa salomlash va mavzu bo‘yicha birinchi, oson savolni ber. Faqat bitta JSON qaytar: {"fix":[],"better":"","reply":"arabcha salom va savol"}`);
  try {
    const r = await s.json(prompt, {modelTier:'default', effort:'low', cache:false});
    if (!r || !r.reply) throw {code:'invalid_json'};
    if (last) { last.fix = Array.isArray(r.fix) ? r.fix : []; last.better = r.better || ''; last.ok = 1; }
    S.turns.push({r:'c', t:String(r.reply)});
    S.busy = false;
    spSave(S.d, 'ch', {at:S.at, topic:S.topic, turns:S.turns, sum:S.sum, flu:S.flu});
    if (SPK === S && view === 'speak') { renderSpeak(); chatScroll(); if (PREF.voice) sayAr(r.reply); }
  } catch(e) { S.busy = false; S.err = sampleErr(e); S.errAt = 'turn'; if (SPK === S && view === 'speak') renderSpeak(); }
}
async function spChatSummary(S){
  await micStop();
  const s = await getSample(); if (!s) return;
  S.busy = true; S.err = ''; if (SPK === S && view === 'speak') { renderSpeak(); chatScroll(); }
  const hist = S.turns.map(t => (t.r === 'u' ? 'Talaba: ' : 'Ustoz: ') + t.t).join('\n');
  const prompt = `Talaba bilan arabcha erkin suhbat bo‘ldi (mavzu: «${S.topic}»). Talabaning darajasini oldindan bilmaysan — faqat gaplariga qarab baholaysan. Talaba gaplari nutqdan yozilgan bo‘lishi mumkin — harakat, so‘z oxiridagi i’rob va tinish belgilarini baholama.
${hist}

Talabaning og‘zaki nutqini bahola. Faqat bitta JSON qaytar:
{"level":"A2|B1|B2|B2+|C1|C1+|C2","good":["2–3 ta kuchli tomon, o‘zbekcha"],"next":["3 ta aniq maslahat, o‘zbekcha"],"top":[{"x":"talaba gapidan parcha","f":"to‘g‘ri shakli","uz":"o‘zbekcha qisqa izoh"}],"words":[["suhbatda foydali bo‘ladigan arabcha ibora (harakat bilan)","o‘zbekcha ma’nosi"]]}
top — eng muhim 3–5 ta xato; words — 5–8 ta ibora. good va next bandlarida talabaning o‘z gapidan qisqa iqtibos keltir.`;
  try {
    const r = await s.json(prompt, {modelTier:'default', cache:false});
    S.sum = r || {}; S.ended = true; S.busy = false;
    spSave(S.d, 'ch', {at:S.at, topic:S.topic, turns:S.turns, sum:S.sum});
    if (hasSpeak(S.d) && S.turns.filter(t => t.r === 'u').length >= 4) markTask(S.d, 's1', true);
    if (SPK === S && view === 'speak') { renderSpeak(); const el = $('#chSum'); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
  } catch(e) { S.busy = false; S.err = sampleErr(e); S.errAt = 'sum'; if (SPK === S && view === 'speak') renderSpeak(); }
}
function chatScroll(){ window.scrollTo({top:document.documentElement.scrollHeight, behavior:'smooth'}); }
function renderChat(){
  const S = SPK, isAr = /[؀-ۿ]/.test(S.topic), nU = S.turns.filter(t => t.r === 'u').length, sm = S.sum;
  let h = `<div class="daybar"><div><div class="eyebrow">Muhodasa · erkin suhbat · ${S.d}-kun</div><h1 class="tt"><span class="${isAr ? 'ar' : ''}">${esc(S.topic)}</span></h1>${S.flu && !S.ended ? '<p class="note" style="margin:4px 0 0">Ravonlik rejimi: tuzatishlar «Yakunlash»dan keyin ko‘rinadi.</p>' : ''}</div>
    <div class="cta">${S.ended ? '' : `<button class="btn alt sm" id="chEnd" ${nU && !S.busy ? '' : 'disabled'}>Yakunlash va baho</button>`}<button class="btn alt sm" id="chBack">Menyuga</button></div></div>
    <div class="chat" id="chat">${S.turns.map((t, i) => t.r === 'c'
      ? `<div class="bub cl"><span class="ar">${esc(t.t)}</span><div class="bub-a"><button class="btn alt sm spk" data-say="${i}" hidden>${ICO.vol}Eshitish</button>${t.uz ? '' : `<button class="btn alt sm" data-tr="${i}">Tarjima</button>`}</div>${t.uz ? `<div class="note bub-tr">${esc(t.uz)}</div>` : ''}</div>`
      : `<div class="bub me"><span class="ar">${esc(t.t)}</span>${t.ok && (!S.flu || S.ended) ? ((t.fix && t.fix.length) || t.better
          ? `<div class="fix">${(t.fix || []).map(e => `<div><div dir="rtl" style="text-align:right"><s class="ar">${esc(e.x)}</s> ← <ins class="ar">${esc(e.f)}</ins></div><span class="note">${esc(e.uz)}</span></div>`).join('')}${t.better ? `<div><span class="note">Yaxshiroq:</span> <span class="ar">${esc(t.better)}</span></div>` : ''}</div>`
          : '<div class="fix ok">Xato topilmadi</div>') : ''}</div>`).join('')}
    ${S.busy ? '<div class="note"><span class="spin"></span> Claude yozmoqda…</div>' : ''}
    ${S.err ? `<div class="fb miss" style="margin:0"><span>${esc(S.err)}</span><span class="cta"><button class="btn alt sm" id="chRe">Qayta urinish</button></span></div>` : ''}</div>`;
  if (sm) h += `<section class="blk" id="chSum"><h4 style="color:var(--navy)">Suhbat bahosi · taxminiy daraja: ${esc(sm.level || '—')}</h4>
      ${sm.top && sm.top.length ? `<div class="errs">${sm.top.map(e => `<div class="err"><div class="pair"><s>${esc(e.x)}</s> ← <ins>${esc(e.f)}</ins></div><span class="k"></span><p>${esc(e.uz)}</p></div>`).join('')}</div>` : ''}
      ${sm.words && sm.words.length ? `<h5 class="sph">Foydali iboralar</h5><div class="vlist">${sm.words.map(w => `<div><span class="ar">${esc(w[0])}</span><small>${esc(w[1])}</small></div>`).join('')}</div>` : ''}</section>
    <div class="split"><section class="blk"><h4 style="color:var(--ok)">Kuchli tomonlar</h4><ul>${(sm.good || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
      <section class="blk"><h4 style="color:var(--crimson)">Keyingi qadam</h4><ul>${(sm.next || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section></div>
    <div class="cta"><button class="btn red" id="chNew">Yangi suhbat</button></div>`;
  if (!S.ended) h += `<div><textarea class="ans" id="chIn" dir="rtl" lang="ar" placeholder="جَوَابُكَ…" style="min-height:96px" aria-label="Javobingiz">${esc(S.draft || '')}</textarea><div class="partial" id="chP"></div>
      <div class="cta"><button class="btn red" id="chSend" ${S.busy ? 'disabled' : ''}>Yuborish</button><button class="btn alt sm mic" id="chMic" hidden></button><span class="note micnote"></span></div></div>`;
  $('#view').innerHTML = h; paintMic();
  $('#view').querySelectorAll('[data-say]').forEach(b => b.onclick = () => { const t = S.turns[+b.dataset.say]; if (TTS && t) TTS.speak(t.t, {language:'ar', rate:0.9}).catch(() => {}); });
  $('#view').querySelectorAll('[data-tr]').forEach(b => b.onclick = async () => {
    const t = S.turns[+b.dataset.tr], s = await getSample(); if (!t || !s) return;
    b.disabled = true; b.textContent = 'Tarjima…';
    try { const r = await s('Quyidagi arabcha gapni o‘zbek tiliga (lotin yozuvi) tabiiy tarjima qil. Faqat tarjimani yoz:\n\n' + t.t, {modelTier:'quick'}); t.uz = r.text.trim(); spSave(S.d, 'ch', {at:S.at, topic:S.topic, turns:S.turns, sum:S.sum}); }
    catch(e) { b.disabled = false; b.textContent = 'Tarjima'; return; }
    if (SPK === S && view === 'speak') { const sy = scrollY; renderChat(); scrollTo(0, sy); }
  });
  $('#chBack').onclick = () => { micStop(); sayStop(); SPK = {mode:'menu', topic:'day'}; renderSpeak(); };
  const ce = $('#chEnd'); if (ce) ce.onclick = () => spChatSummary(S);
  const cr = $('#chRe'); if (cr) cr.onclick = () => S.errAt === 'sum' ? spChatSummary(S) : spChatCall(S);
  const cn = $('#chNew'); if (cn) cn.onclick = () => { SPK = {mode:'menu', topic:'day'}; renderSpeak(); window.scrollTo({top:0}); };
  const ta = $('#chIn');
  if (ta) {
    const pe = $('#chP'); micBind(ta, pe);
    ta.oninput = () => { S.draft = ta.value; };
    $('#chMic').onclick = () => micClick(ta, pe);
    const send = async () => {
      if (S.busy) return;
      await micStop();
      const text = (ta.value || '').trim(); if (!text) return;
      sayStop();
      S.turns.push({r:'u', t:text}); S.draft = '';
      spChatCall(S); chatScroll();
    };
    $('#chSend').onclick = send;
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } };
  }
}

const ASK_RULES = `Sen talabaning shaxsiy arab tili ustozi va o‘quv sherigisan. Talaba Tanal (التنال العربي) imtihoniga reja bilan tayyorlanmoqda: darajasi B2 atrofida, maqsadi C1–C2; eng zaif joylari nahv, sarf va kitaba (imlo). U «Tanal 30 kunlik reja» ilovasidan foydalanmoqda.
Javob qoidalari: o‘zbek tilida (lotin yozuvi) javob ber; arabcha misollarni to‘liq harakat bilan yoz; qisqa va aniq bo‘l (odatda 3–8 jumla, kerak bo‘lsa qisqa ro‘yxat); Markdown belgilarini (yulduzcha, panjara) ishlatma. Talaba arabcha yozsa yoki mashq so‘rasa — arabcha ishla.
Bosqichli yordam: talaba o‘z matnini tuzatishni so‘rasa, avval faqat xato joyi va turini ko‘rsat; to‘g‘ri shaklni u o‘zi urinib ko‘rgach yoki «to‘liq ber» desa ber. Test, o‘qish yoki eshitish savoli javobini talaba javob bermaguncha aytma. Ishonching komil bo‘lmasa, «aniq emas» de — taxminni haqiqat sifatida berma.
Tanal formati: eshitish (5 qisqa dialog, uzun dialog, ma’ruza), grammatika (30 savol × 1 daqiqa), o‘qish (6 + 8 + 10 savollik 3 matn), yozish (100 va 200 so‘z, har biri 18 daqiqa), gapirish (6 savol, 5 balldan). Imtihon: 2026-yil 20-dekabr.`;
const strip = h => String(h ?? '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
const unmd = s => String(s).replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s*/gm, '').replace(/^\s*[-*]\s+/gm, '• ');
const arWrap = s => s.replace(/[؀-ۿ]+(?:[  ]+[؀-ۿ]+)*/g, m => `<span class="ar">${m}</span>`);
function askCtx(){
  let label = VNAME[view] || '', t = '';
  if (view === 'today' || view === 'plan') {
    const d = selDay, y = DY(d); label += ` · ${d}-kun`;
    t = `${d}-kun (${y.wd}, ${y.date}). Kun yo‘nalishi: ${y.note}\nVazifalar:\n` + tasksFor(d).map(x => `- ${x.tm}: ${strip(x.h)} — ${strip(x.what)}${isDone(d, x.id) ? ' [bajarildi]' : ''}`).join('\n');
  } else if (view === 'rules') {
    const tp = T[cur]; label += ' · ' + tp.uz;
    t = `Mavzu: ${tp.title} (${tp.uz})\nKitobda: ${tp.kitob.map(strip).join(' ')}\nKitobdagi xatolar: ${tp.tuz.map(strip).join(' ') || '—'}\nQo‘shimcha qoidalar:\n${tp.add.map(r => '- ' + r.h + ': ' + strip(r.b)).join('\n')}`;
  } else if (view === 'quiz') {
    if (run && $('#qc')) {
      const q = run.qs[run.k], ans = q.c !== null && q.c !== undefined ? q.o[q.c] : q.a; label += ` · ${run.k+1}-savol`;
      t = `Test savoli (mavzu: ${T[q.t].title} — ${T[q.t].uz}):\n${q.s}\n${q.x ? 'Jumla: ' + q.x + '\n' : ''}Variantlar: ${q.o.map((o, i) => LET[i] + ') ' + o).join('  ')}\n`
        + (run.answered ? `To‘g‘ri javob: ${ans}. Talaba javob berib bo‘ldi.` : 'Talaba hali javob bermagan: to‘g‘ri javobni AYTMA — qoidani eslat va yo‘naltiruvchi savol ber, u o‘zi topsin.');

    strip += `<i class="${c}${k === ti ? ' now' : ''}" title="${k}-kun${m ? ` · ${m.n}/${m.cnt}` : ''}"></i>`;
  }
  const card = `<section class="zcard" aria-label="Zanjir"><div class="zrow"><div><span class="zl">Zanjir</span><b>${s} kun</b></div><div style="text-align:right"><span class="zl">Eng uzun</span><b>${best} kun</b></div></div>
      <div class="zstrip">${strip}</div><span class="zl">Kun hisoblanadi: vazifalarning kamida yarmi bajarilsa (minimal kunda — hammasi).</span></section>
    <button type="button" class="rowbtn" id="toPlan"><span>${IC.cal}${ND} kunlik reja</span>${IC.right}</button>`;
  const first = $('#view').firstElementChild;
  if (first) first.insertAdjacentHTML('afterend', card); else $('#view').insertAdjacentHTML('afterbegin', card);
  $('#toPlan').onclick = () => navTo('plan');
}

/* ---------- Telegram: orqaga tugmasi, pastki panel, yopishni tasdiqlash ---------- */
const TOPV = new Set(['today', 'mashq', 'claude', 'natija']);
let HOME = 'today';
function miniAfterView(v){
  if (TOPV.has(v)) HOME = v;
  document.querySelectorAll('#bnav button').forEach(b => b.setAttribute('aria-current', b.dataset.b === HOME));
  if (!TG) return;
  try { if (TOPV.has(v)) TG.BackButton.hide(); else TG.BackButton.show(); } catch(e) {}
  try { if (v === 'quiz' && run) TG.enableClosingConfirmation(); else TG.disableClosingConfirmation(); } catch(e) {}
}
async function miniRefresh(){
  if (!DB || !window.__API) return;
  try {
    const r = await window.__API('get', {keys:['plan', 'botdone']}); if (!r || !r.kv) return;
    let ch = false; const rp = r.kv.plan;
    if (rp && (rp.ts || 0) > (PS.ts || 0)) { KVC.plan = rp; PS = Object.assign({done:{}, diary:{}}, JSON.parse(JSON.stringify(rp))); lsSet('plan', PS); ch = true; }
    if (r.kv.botdone) { KVC.botdone = r.kv.botdone; if (mergeBot(r.kv.botdone)) ch = true; }
    if (ch && (TOPV.has(view) || view === 'plan')) render();
  } catch(e) {}
}
function miniGo(go){
  const ti = todayIdx(); selDay = ti;
  if (go === 'min') { PS.min = PS.min || {}; PS.min['d' + ti] = 1; savePlan(); return setView('today'); }
  if (go === 'now') { const nt = nowTask(ti, tasksFor(ti)); if (nt && nt.act[0]) { markStart(ti, nt.id); return nt.act[0][1](); } return setView('today'); }
  if (go.startsWith('t:')) {
    const t = tasksFor(ti).find(x => x.id === go.slice(2));
    if (t) { const a = aiOf(t); if (a) { CLF = a[1]; return setView('claude'); } if (t.act[0] && !taskDone(ti, t)) { markStart(ti, t.id); return t.act[0][1](); } }
    return setView('today');
  }
  if (['mashq', 'claude', 'natija', 'vocab', 'wrong', 'listen', 'quiz', 'plan'].includes(go)) return navTo(go);
}
{ const sr = startRun, fi = finish;                // test boshlanganda/tugaganda — yopishni tasdiqlash
  startRun = function(){ const r = sr.apply(null, arguments); miniAfterView(view); return r; };
  finish = function(){ const r = fi.apply(null, arguments); miniAfterView(view); return r; }; }
function miniStart(){
  $('#bnav').hidden = false;
  if (mergeBot(KVC.botdone)) render();
  pushSched();
  document.addEventListener('click', e => { if (TG && TG.HapticFeedback && e.target.closest && e.target.closest('.opt,.ck,.vgrade .btn,.tile')) { try { TG.HapticFeedback.selectionChanged(); } catch(_) {} } }, true);
  if (TG) {
    try { TG.BackButton.onClick(() => navTo(HOME === view ? 'today' : HOME)); } catch(e) {}
    try { TG.onEvent('activated', miniRefresh); } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') miniRefresh(); });
  const qs = new URLSearchParams(location.search);
  const go = qs.get('go') || (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || '';
  if (/^[a-z]{2,8}$|^t:[a-zA-Z0-9]{1,6}$/.test(go)) miniGo(go);
}

/* ---------- views ---------- */
const SIDE = ['rules', 'quiz'];
const GROUP = {today:'today', mock:'today', quiz:'quiz', write:'skill', read:'skill', listen:'skill', speak:'skill', vocab:'vocab', plan:'more', rules:'more', wrong:'more', stats:'more', typing:'more'};
const SHEETS = {
  skill:[['write', 'Yozish'], ['read', 'O‘qish'], ['listen', 'Eshitish'], ['speak', 'Muhodasa']],
  more:[['plan', 'Reja'], ['rules', 'Qoidalar'], ['wrong', 'Xatolarim'], ['typing', 'Terish testi'], ['stats', 'Natijalar']]
};
function render(){
  if (view === 'mashq') return renderMashq();
  if (view === 'claude') return renderClaude();
  if (view === 'natija') return renderNatija();
  if (view === 'today') renderToday();
  else if (view === 'plan') renderPlan();
  else if (view === 'rules') { renderIndex(); renderRules(); }
  else if (view === 'quiz') { renderIndex(); if (!(run && $('#qc'))) renderSetup(); }
  else if (view === 'write') renderWrite();
  else if (view === 'read') renderRead();
  else if (view === 'listen') renderListen();
  else if (view === 'speak') renderSpeak();
  else if (view === 'mock') renderMock();
  else if (view === 'vocab') renderVocab();
  else if (view === 'wrong') renderWrong();
  else if (view === 'stats') renderStats();
  else if (view === 'typing') renderTyping();
}
function setView(v, quiet){
  if (v === 'write' || v === 'speak' || (v === 'read' && !readOff)) { CLF = v; v = 'claude'; }
  clearInterval(qTimer); clearInterval(wTimer); clearInterval(rTimer); clearInterval(sTimer); clearInterval(dTimer); clearInterval(lTimer); clearInterval(tyTimer);
  if (view === 'speak' && v !== 'speak') {
    micStop(); sayStop();
    if (SPK.mode === 'exam') { if (SPK.phase === 'run') { const ta = $('#spA'); if (ta) SPK.ans[SPK.k] = ta.value; SPK.phase = 'done'; } else if (SPK.phase === 'prep' || SPK.phase === 'hear') SPK.phase = 'ready'; }
    if (SPK.mode === 'redo' && SPK.phase === 'run') SPK.phase = 'gap';
  }
  if (view === 'listen' && v !== 'listen') { try { if (LAUD) LAUD.pause(); } catch(e) {} }
  view = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  document.querySelectorAll('#bnav button').forEach(b => b.setAttribute('aria-current', b.dataset.b === GROUP[v]));
  $('#sheet').hidden = true;
  $('#shell').classList.toggle('full', !SIDE.includes(v));
  if (!(v === 'quiz' && quiet)) $('#shell').classList.remove('running');
  if (v === 'vocab') vq = null;
  if (v === 'quiz') { renderIndex(); if (!quiet) { run = null; renderSetup(); } }
  else render();
  window.scrollTo({top:0});
  miniAfterView(v);
  $('#askFab').hidden = askHide(v) || !$('#ask').hidden;
  if (!$('#ask').hidden) { if (askHide(v)) { $('#ask').hidden = true; } else renderAsk(); }
}
function navTo(v){
  if (MOCK.on) MOCK = {on:false, d:0};
  if (v === 'write') { writeDay = selDay; wPart = 0; }
  if (v === 'read') { readDay = selDay; readOff = false; }
  if (v === 'typing') TYP = null;
  if (v === 'vocab') vocDay = selDay;
  if (v === 'listen') listenDay = selDay;
  if (v === 'speak') { if (SPK.mode === 'result' || SPK.mode === 'redo' || (SPK.mode === 'chat' && SPK.ended)) SPK = {mode:'menu', topic:'day'}; if (SPK.mode === 'menu') speakDay = selDay; }
  setView(v);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => navTo(b.dataset.v));
document.querySelectorAll('#bnav button').forEach(b => b.onclick = () => {
  const g = b.dataset.b;
  if (!SHEETS[g]) return navTo(g);
  const sh = $('#sheet');
  if (!sh.hidden && sh.dataset.g === g) { sh.hidden = true; return; }
  sh.dataset.g = g;
  $('#sheetIn').innerHTML = `<h4>${g === 'skill' ? 'Mahorat' : 'Yana'}</h4>` + SHEETS[g].map(([v, l]) => `<button type="button" role="menuitem" data-sv="${v}" aria-current="${view === v}">${esc(l)}</button>`).join('');
  $('#sheetIn').querySelectorAll('[data-sv]').forEach(x => x.onclick = () => navTo(x.dataset.sv));
  sh.hidden = false;
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) { e.preventDefault(); $('#sheet').hidden = true; } });
initCloud();
setView('today');
miniStart();
initVoice().catch(() => { DICT = TTS = null; paintMic(); });
};
</script>
<script>
/* Yuklovchi: Telegram initData → tanal-api → kontent (yopiq ombor, imzoli havola) → ilovani ishga tushirish */
(function(){
  const W = window.Telegram && window.Telegram.WebApp;
  const view = document.getElementById('view');
  const gate = (h, t) => { view.innerHTML = `<div class="gate"><div class="gcard"><div class="tbar"></div><h2>${h}</h2><p>${t}</p></div></div>`; };
  if (W) { try { W.ready(); W.expand(); W.setHeaderColor('#0D3A1A'); W.setBackgroundColor('#EAF4EA'); if (W.setBottomBarColor) W.setBottomBarColor('#0D3A1A'); if (W.disableVerticalSwipes) W.disableVerticalSwipes(); } catch(e) {} }
  const REF_OK = r => /^[a-z0-9]{20}$/.test(r || '');
  let ref = new URLSearchParams(location.search).get('s') || '';
  try { if (REF_OK(ref)) localStorage.setItem('tmini-ref', ref); else ref = localStorage.getItem('tmini-ref') || ''; } catch(e) { if (!REF_OK(ref)) ref = ''; }
  const init = W && W.initData;
  if (!init) return gate('Telegram orqali oching', 'Bu ilova faqat Telegram’dagi Tanal boti ichida ishlaydi: botni oching va «Ilovani ochish» tugmasini bosing.');
  if (!REF_OK(ref)) return gate('Sozlash tugallanmagan', 'Ilovani botdagi tugma orqali oching — server manzili o‘sha tugmada keladi.');
  const API_URL = 'https://' + ref + '.supabase.co/functions/v1/tanal-api';
  window.__API = async (op, body) => {
    const r = await fetch(API_URL, {method:'POST', headers:{'content-type':'text/plain'}, body:JSON.stringify(Object.assign({op, init}, body || {}))});
    let j = null; try { j = await r.json(); } catch(e) {}
    if (!r.ok || !j || !j.ok) { const er = new Error((j && j.err) || ('http ' + r.status)); er.status = r.status; throw er; }
    return j;
  };
  gate('Yuklanmoqda…', 'Reja, savollar va natijalaringiz olinmoqda.');
  const cached = () => { try { const v = localStorage.getItem('tmini-cv'), c = localStorage.getItem('tmini-c'); return v && c ? {v, c:JSON.parse(c)} : null; } catch(e) { return null; } };
  (async () => {
    let C = null, K = null;
    try {
      const r = await window.__API('init');
      K = r.kv || {}; window.__AUDIO = r.audio || {};
      const ch = cached();
      if (ch && r.content && ch.v === r.content.ver) C = ch.c;
      else {
        const cr = await fetch(r.content.url); if (!cr.ok) throw new Error('kontent ' + cr.status);
        const txt = await cr.text(); C = JSON.parse(txt);
        try { localStorage.setItem('tmini-c', txt); localStorage.setItem('tmini-cv', r.content.ver); } catch(e) { try { localStorage.removeItem('tmini-c'); localStorage.removeItem('tmini-cv'); } catch(_) {} }
      }
    } catch(e) {
      if (e && e.status === 403) return gate('Ruxsat yo‘q', 'Bu ilova faqat egasi uchun.');
      if (e && e.status === 401) return gate('Seans eskirgan', 'Ilovani yoping va bot orqali qayta oching.');
      const ch = cached();
      if (!ch) return gate('Ulanib bo‘lmadi', 'Internetni tekshiring va ilovani qayta oching.');
      C = ch.c; K = null;                    // oflayn: natijalar telefonda saqlanadi, keyin yuboriladi
    }
    window.__KV = K;
    try { window.__boot(C); }
    catch(e) { gate('Xatolik', 'Ilova ishga tushmadi: ' + String((e && e.message) || e).replace(/[<>&]/g, '').slice(0, 200)); }
  })();
})();
</script>
